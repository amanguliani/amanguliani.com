<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letters from Grandma — A Photobook</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Dancing+Script:wght@500;700&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="book.js" defer></script>
</head>

<body>

  <!-- Header UI Navigation Shell -->
  <header id="editor-ui">
    <span class="ui-brand">Letters from Grandma</span>
    <span class="ui-sep"></span>
    <span class="page-indicator">Dadi's Letters</span>
  </header>

  <!-- Premium Loader Screen Overlay -->
  <div id="loader-overlay" style="
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, #FFFEF9, #FAF7F2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.5s;
">
    <div style="text-align: center; padding: 20px;">
      <!-- Elegant gold loader spinner ring -->
      <div class="loader-spinner" style="
          width: 50px;
          height: 50px;
          border: 3px solid rgba(197, 160, 67, 0.1);
          border-top: 3px solid var(--gold);
          border-radius: 50%;
          margin: 0 auto 24px;
      "></div>
      <div style="
          font-family: 'Dancing Script', cursive;
          font-size: 32px;
          color: var(--ink);
          margin-bottom: 8px;
      ">Story of the wonder boy Riyan</div>
      <div id="loader-status" style="
          font-family: 'Jost', sans-serif;
          font-size: 13px;
          color: var(--ink-faint);
          letter-spacing: 0.08em;
          text-transform: uppercase;
      ">Opening the photobook...</div>
    </div>
  </div>

  <!-- Main Photobook Wrapper -->
  <main id="book-wrap"></main>

</body>

</html>
